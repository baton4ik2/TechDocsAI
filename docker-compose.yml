services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: techdocs
      POSTGRES_USER: techdocs
      POSTGRES_PASSWORD: techdocs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: techdocs
      MINIO_ROOT_PASSWORD: techdocs123
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    # Для GPU (NVIDIA) раскомментируйте:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # одноразовый контейнер: скачивает модели в общий том при первом запуске
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    # vision-модель качаем только если она локальная (vision-провайдер не задан
    # или указывает на ollama) — облачные модели типа gemini скачивать не нужно
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${AI_CHAT_MODEL:-qwen2.5:7b} && case \"${AI_VISION_BASE_URL:-}\" in ''|*ollama*) if [ -n \"${AI_VISION_MODEL:-}\" ]; then ollama pull ${AI_VISION_MODEL}; fi;; esac"]
    restart: "no"

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/techdocs
      DB_USERNAME: techdocs
      DB_PASSWORD: techdocs
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: techdocs
      STORAGE_SECRET_KEY: techdocs123
      STORAGE_BUCKET: techdocs-documents
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@techdocs.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-secret-key}
      AI_BASE_URL: ${AI_BASE_URL:-http://ollama:11434/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen2.5:7b}
      AI_VISION_BASE_URL: ${AI_VISION_BASE_URL:-}
      AI_VISION_API_KEY: ${AI_VISION_API_KEY:-}
      AI_VISION_MODEL: ${AI_VISION_MODEL:-}
      AI_VISION_DPI: ${AI_VISION_DPI:-160}
      AI_MATCH_BASE_URL: ${AI_MATCH_BASE_URL:-}
      AI_MATCH_API_KEY: ${AI_MATCH_API_KEY:-}
      AI_MATCH_MODEL: ${AI_MATCH_MODEL:-}
      DRIVE_SERVICE_ACCOUNT_KEY: ${DRIVE_SERVICE_ACCOUNT_KEY:-}
    volumes:
      - ./secrets:/secrets:ro
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  ollama_data:
