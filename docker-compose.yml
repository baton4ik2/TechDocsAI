services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: techdocs
      POSTGRES_USER: techdocs
      POSTGRES_PASSWORD: techdocs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techdocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: techdocs
      MINIO_ROOT_PASSWORD: techdocs123
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/techdocs
      DB_USERNAME: techdocs
      DB_PASSWORD: techdocs
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: techdocs
      STORAGE_SECRET_KEY: techdocs123
      STORAGE_BUCKET: techdocs-documents
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@techdocs.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-use-a-long-random-secret-key}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
