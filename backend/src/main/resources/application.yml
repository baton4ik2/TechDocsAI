server:
  port: 8080

spring:
  application:
    name: techdocs-ai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/techdocs}
    username: ${DB_USERNAME:techdocs}
    password: ${DB_PASSWORD:techdocs}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

techdocs:
  auth:
    admin-email: ${ADMIN_EMAIL:admin@techdocs.local}
    admin-password: ${ADMIN_PASSWORD:admin123}
    jwt-secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:techdocs}
    secret-key: ${STORAGE_SECRET_KEY:techdocs123}
    bucket: ${STORAGE_BUCKET:techdocs-documents}
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    # vision-модель для извлечения оборудования из сканов (читает картинку страницы
    # напрямую, без OCR). Пусто — извлечение работает по распознанному тексту.
    vision-model: ${AI_VISION_MODEL:}
    # Разрешение картинки для vision. 160 — проверенный баланс: на 220 qwen2.5vl:7b
    # начинает возвращать пустые ответы (изображение переполняет контекст модели).
    vision-dpi: ${AI_VISION_DPI:160}
  document:
    max-file-size-mb: 100
    max-pages: 500
  ocr:
    command: ${OCR_COMMAND:tesseract}
    languages: ${OCR_LANGUAGES:rus+eng}
    # 300 dpi заметно точнее для кириллицы (двуязычные сканы), но медленнее
    dpi: ${OCR_DPI:300}
    max-pages: ${OCR_MAX_PAGES:100}
    page-timeout-seconds: ${OCR_PAGE_TIMEOUT:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    ru.techdocs: INFO
